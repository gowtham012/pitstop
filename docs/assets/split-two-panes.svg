<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1024 494" width="1024" height="494" role="img" aria-label="Mockup of one terminal window split into two live panes: the main session on the left still running pytest, the fork on the right fixing auth.py, and a status bar listing both branches and the hotkeys.">
<title>Mockup of one terminal window split into two live panes: the main session on the left still running pytest, the fork on the right fixing auth.py, and a status bar listing both branches and the hotkeys.</title>
<style>
:root{--bg:#F2F4F3;--surface:#FFFFFF;--fg:#1B1F22;--muted:#5A6369;--line:#C4CACD;--lane:#E7EBEA;--main:#2C6A9E;--main-soft:#D4E3EF;--fork:#B8730A;--fork-soft:#F5E2C2;--ok:#2E7D4F;
--display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#0D1117;--surface:#161B22;--fg:#E6EDF3;--muted:#9AA4AD;--line:#3A4247;--lane:#1B2127;--main:#6FA8D8;--main-soft:#1D3245;--fork:#E3A33B;--fork-soft:#3B2C12;--ok:#5DBB85}}
text{font-family:var(--body);fill:var(--fg);font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.sm{font-size:11px;fill:var(--muted)}
.lane-label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;fill:var(--muted)}
.lane{fill:var(--lane)}
.stroke{stroke:var(--muted);fill:none;stroke-width:1.5}
.stroke-m{stroke:var(--main);fill:none;stroke-width:2}
.stroke-f{stroke:var(--fork);fill:none;stroke-width:2}
.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 4}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box-m{fill:var(--main-soft);stroke:var(--main);stroke-width:1.4}
.box-f{fill:var(--fork-soft);stroke:var(--fork);stroke-width:1.4}
.box-cli{fill:var(--surface);stroke:var(--fg);stroke-width:1.4}
.fill-m{fill:var(--main)}.fill-f{fill:var(--fork)}.fill-n{fill:var(--muted)}.fill-bg{fill:var(--surface)}
.t-m{fill:var(--main)}.t-f{fill:var(--fork)}.t-ok{fill:var(--ok)}
.on-dark{fill:var(--surface);font-family:var(--mono);font-size:11px}
.b{font-weight:600}
.mk-n{fill:var(--muted)}.mk-m{fill:var(--main)}.mk-f{fill:var(--fork)}
.backdrop{fill:var(--bg)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-n" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-f" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="backdrop" x="-12" y="-12" width="1024" height="494" rx="14"/>

          <rect class="box" x="10" y="10" width="980" height="450" rx="10" style="stroke-width:1.5"/>
          <line class="stroke" x1="10" y1="40" x2="990" y2="40" style="stroke:var(--line)"/>
          <circle class="fill-n" cx="32" cy="25" r="5" opacity=".5"/><circle class="fill-n" cx="50" cy="25" r="5" opacity=".5"/><circle class="fill-n" cx="68" cy="25" r="5" opacity=".5"/>
          <text class="sm" x="500" y="29" text-anchor="middle">~/my-app · pit · 2 sessions running at the same time</text>

          <!-- left pane: main -->
          <rect x="24" y="52" width="466" height="350" rx="4" style="fill:none;stroke:var(--line);stroke-width:1"/>
          <circle class="fill-m" cx="40" cy="68" r="4"/>
          <text class="mono b" x="52" y="72" style="fill:var(--main)">main</text>
          <text class="mono sm" x="92" y="72">session 3f2a</text>
          <rect x="406" y="60" width="74" height="17" rx="8.5" style="fill:var(--main-soft);stroke:var(--main)"/>
          <text class="mono b" x="443" y="72" text-anchor="middle" style="font-size:10px;fill:var(--main)">RUNNING</text>
          <line x1="24" y1="82" x2="490" y2="82" style="stroke:var(--line)"/>
          <text class="mono" x="40" y="108"><tspan style="fill:var(--main)">●</tspan> Bash(pytest -q)</text>
          <text class="mono sm" x="40" y="128">  ⎿ tests/test_agents.py ........  [ 41%]</text>
          <text class="mono sm" x="40" y="148">  ⎿ tests/test_memory.py ......    [ 58%]</text>
          <text class="mono sm" x="40" y="168">  ⎿ tests/test_tracing.py ...F     [ 66%]</text>
          <text class="mono" x="40" y="194"><tspan style="fill:var(--main)">●</tspan> 1 failure in tracing. Fixing it.</text>
          <text class="mono" x="40" y="216"><tspan style="fill:var(--main)">●</tspan> Update(app/tracing.py)</text>
          <text class="mono sm" x="40" y="236">  ⎿ +5 −2</text>
          <text class="mono" x="40" y="258"><tspan style="fill:var(--main)">●</tspan> Bash(pytest tests/test_tracing.py)</text>
          <text class="mono" x="40" y="284" style="fill:var(--main)">✻ Running… 14m 02s</text>
          <text class="mono sm" x="40" y="380">keeps working · keys go to the focused pane</text>

          <!-- right pane: fork (focused) -->
          <rect x="510" y="52" width="466" height="350" rx="4" style="fill:none;stroke:var(--fork);stroke-width:2"/>
          <circle class="fill-f" cx="526" cy="68" r="4"/>
          <text class="mono b" x="538" y="72" style="fill:var(--fork)">fix-login</text>
          <text class="mono sm" x="612" y="72">fork of 3f2a</text>
          <rect x="892" y="60" width="74" height="17" rx="8.5" style="fill:var(--fork-soft);stroke:var(--fork)"/>
          <text class="mono b" x="929" y="72" text-anchor="middle" style="font-size:10px;fill:var(--fork)">RUNNING</text>
          <line x1="510" y1="82" x2="976" y2="82" style="stroke:var(--fork);opacity:.5"/>
          <text class="mono" x="526" y="108" style="fill:var(--muted)">&#62; fix the login 500 error</text>
          <text class="mono" x="526" y="134"><tspan style="fill:var(--fork)">●</tspan> I know this codebase. Checking auth.py.</text>
          <text class="mono" x="526" y="156"><tspan style="fill:var(--fork)">●</tspan> Update(app/auth.py)</text>
          <text class="mono sm" x="526" y="176">  ⎿ +3 −1  null check on token refresh</text>
          <text class="mono" x="526" y="198"><tspan style="fill:var(--fork)">●</tspan> Bash(pytest tests/test_auth.py)</text>
          <text class="mono sm" x="526" y="218">  ⎿ 12 passed in 3.1s</text>
          <text class="mono" x="526" y="240"><tspan style="fill:var(--fork)">●</tspan> Committed on pit/fix-login.</text>
          <rect x="522" y="356" width="442" height="32" rx="4" style="fill:none;stroke:var(--line)"/>
          <text class="mono" x="534" y="377">&#62; <tspan style="fill:var(--fork)">▍</tspan></text>

          <!-- status bar -->
          <rect x="24" y="414" width="952" height="34" rx="4" style="fill:var(--lane)"/>
          <text class="mono" x="38" y="436"><tspan style="fill:var(--main)">main ● running</tspan>  │  </text>
          <rect x="182" y="420" width="166" height="22" rx="3" style="fill:var(--fork-soft);stroke:var(--fork)"/>
          <text class="mono" x="192" y="436" style="fill:var(--fork)">fix-login ● running</text>
          <text class="mono sm" x="962" y="436" text-anchor="end">ctrl+\ then: f fork · ←→ focus · m merge · z zoom · t tree</text>
        
</svg>
