<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1024 494" width="1024" height="494" role="img" aria-label="Mockup of one terminal with four live panes: the main session takes the left half, three forks are stacked on the right, and the status bar lists five sessions including one background fork, with total cost.">
<title>Mockup of one terminal with four live panes: the main session takes the left half, three forks are stacked on the right, and the status bar lists five sessions including one background fork, with total cost.</title>
<style>
:root{--bg:#F2F4F3;--surface:#FFFFFF;--fg:#1B1F22;--muted:#5A6369;--line:#C4CACD;--lane:#E7EBEA;--main:#2C6A9E;--main-soft:#D4E3EF;--fork:#B8730A;--fork-soft:#F5E2C2;--ok:#2E7D4F;
--display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#0D1117;--surface:#161B22;--fg:#E6EDF3;--muted:#9AA4AD;--line:#3A4247;--lane:#1B2127;--main:#6FA8D8;--main-soft:#1D3245;--fork:#E3A33B;--fork-soft:#3B2C12;--ok:#5DBB85}}
text{font-family:var(--body);fill:var(--fg);font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.sm{font-size:11px;fill:var(--muted)}
.lane-label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;fill:var(--muted)}
.lane{fill:var(--lane)}
.stroke{stroke:var(--muted);fill:none;stroke-width:1.5}
.stroke-m{stroke:var(--main);fill:none;stroke-width:2}
.stroke-f{stroke:var(--fork);fill:none;stroke-width:2}
.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 4}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box-m{fill:var(--main-soft);stroke:var(--main);stroke-width:1.4}
.box-f{fill:var(--fork-soft);stroke:var(--fork);stroke-width:1.4}
.box-cli{fill:var(--surface);stroke:var(--fg);stroke-width:1.4}
.fill-m{fill:var(--main)}.fill-f{fill:var(--fork)}.fill-n{fill:var(--muted)}.fill-bg{fill:var(--surface)}
.t-m{fill:var(--main)}.t-f{fill:var(--fork)}.t-ok{fill:var(--ok)}
.on-dark{fill:var(--surface);font-family:var(--mono);font-size:11px}
.b{font-weight:600}
.mk-n{fill:var(--muted)}.mk-m{fill:var(--main)}.mk-f{fill:var(--fork)}
.backdrop{fill:var(--bg)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-n" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-f" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="backdrop" x="-12" y="-12" width="1024" height="494" rx="14"/>

          <rect class="box" x="10" y="10" width="980" height="450" rx="10" style="stroke-width:1.5"/>
          <line class="stroke" x1="10" y1="40" x2="990" y2="40" style="stroke:var(--line)"/>
          <circle class="fill-n" cx="32" cy="25" r="5" opacity=".5"/><circle class="fill-n" cx="50" cy="25" r="5" opacity=".5"/><circle class="fill-n" cx="68" cy="25" r="5" opacity=".5"/>
          <text class="sm" x="500" y="29" text-anchor="middle">~/my-app · pit · 5 sessions, all running at the same time</text>

          <!-- main -->
          <rect x="24" y="52" width="470" height="350" rx="4" style="fill:none;stroke:var(--line)"/>
          <circle class="fill-m" cx="40" cy="68" r="4"/>
          <text class="mono b" x="52" y="72" style="fill:var(--main)">1 main</text>
          <rect x="406" y="60" width="74" height="17" rx="8.5" style="fill:var(--main-soft);stroke:var(--main)"/>
          <text class="mono b" x="443" y="72" text-anchor="middle" style="font-size:10px;fill:var(--main)">RUNNING</text>
          <line x1="24" y1="82" x2="494" y2="82" style="stroke:var(--line)"/>
          <text class="mono" x="40" y="108"><tspan style="fill:var(--main)">●</tspan> Bash(pytest -q)</text>
          <text class="mono sm" x="40" y="128">  ⎿ tests/test_memory.py ......    [ 58%]</text>
          <text class="mono sm" x="40" y="148">  ⎿ tests/test_tracing.py ...F     [ 66%]</text>
          <text class="mono" x="40" y="174"><tspan style="fill:var(--main)">●</tspan> Update(app/tracing.py)</text>
          <text class="mono" x="40" y="200" style="fill:var(--main)">✻ Running… 14m 02s</text>
          <rect x="36" y="300" width="446" height="88" rx="4" style="fill:var(--fork-soft);stroke:var(--fork);stroke-dasharray:4 3"/>
          <text class="mono sm" x="48" y="320" style="fill:var(--fork)">&#60;pitstop-update&#62; from docs-typo, merged:</text>
          <text class="mono sm" x="48" y="340">README.md changed. No tests affected.</text>
          <text class="mono sm" x="48" y="360">Arrived after the last tool call, no typing.</text>

          <!-- fork 2 (focused) -->
          <rect x="510" y="52" width="466" height="110" rx="4" style="fill:none;stroke:var(--fork);stroke-width:2"/>
          <circle class="fill-f" cx="526" cy="68" r="4"/>
          <text class="mono b" x="538" y="72" style="fill:var(--fork)">2 fix-login</text>
          <text class="mono sm" x="632" y="72">fork of main</text>
          <rect x="892" y="60" width="74" height="17" rx="8.5" style="fill:var(--fork-soft);stroke:var(--fork)"/>
          <text class="mono b" x="929" y="72" text-anchor="middle" style="font-size:10px;fill:var(--fork)">RUNNING</text>
          <text class="mono" x="526" y="100"><tspan style="fill:var(--fork)">●</tspan> Update(app/auth.py)</text>
          <text class="mono" x="526" y="122"><tspan style="fill:var(--fork)">●</tspan> Bash(pytest tests/test_auth.py)</text>
          <text class="mono sm" x="526" y="142">  ⎿ 12 passed</text>

          <!-- fork 3 -->
          <rect x="510" y="172" width="466" height="110" rx="4" style="fill:none;stroke:var(--line)"/>
          <circle class="fill-f" cx="526" cy="188" r="4"/>
          <text class="mono b" x="538" y="192" style="fill:var(--fork)">3 bump-deps</text>
          <text class="mono sm" x="632" y="192">fork of main</text>
          <rect x="892" y="180" width="74" height="17" rx="8.5" style="fill:var(--fork-soft);stroke:var(--fork)"/>
          <text class="mono b" x="929" y="192" text-anchor="middle" style="font-size:10px;fill:var(--fork)">RUNNING</text>
          <text class="mono" x="526" y="220"><tspan style="fill:var(--fork)">●</tspan> Bash(pnpm up next@15)</text>
          <text class="mono" x="526" y="242"><tspan style="fill:var(--fork)">●</tspan> Fixing 2 type errors…</text>
          <text class="mono sm" x="526" y="262">  ⎿ PORT 3200 (offset slot 2)</text>

          <!-- fork 4 (fork of fork 2) -->
          <rect x="510" y="292" width="466" height="110" rx="4" style="fill:none;stroke:var(--line)"/>
          <circle class="fill-f" cx="526" cy="308" r="4"/>
          <text class="mono b" x="538" y="312" style="fill:var(--fork)">4 auth-tests</text>
          <text class="mono sm" x="632" y="312">fork of fix-login</text>
          <rect x="892" y="300" width="74" height="17" rx="8.5" style="fill:var(--fork-soft);stroke:var(--fork)"/>
          <text class="mono b" x="929" y="312" text-anchor="middle" style="font-size:10px;fill:var(--fork)">RUNNING</text>
          <text class="mono" x="526" y="340"><tspan style="fill:var(--fork)">●</tspan> Writing edge-case tests for refresh</text>
          <text class="mono" x="526" y="362"><tspan style="fill:var(--fork)">●</tspan> Write(tests/test_refresh.py)</text>
          <text class="mono sm" x="526" y="382">  ⎿ +48</text>

          <!-- status bar -->
          <rect x="24" y="414" width="952" height="34" rx="4" style="fill:var(--lane)"/>
          <text class="mono" x="38" y="436" style="fill:var(--main)">1 main ●</text>
          <text class="mono sm" x="112" y="436">│</text>
          <rect x="124" y="420" width="110" height="22" rx="3" style="fill:var(--fork-soft);stroke:var(--fork)"/>
          <text class="mono" x="132" y="436" style="fill:var(--fork)">2 fix-login ●</text>
          <text class="mono sm" x="242" y="436">│</text>
          <text class="mono" x="254" y="436" style="fill:var(--fork)">3 bump-deps ●</text>
          <text class="mono sm" x="362" y="436">│</text>
          <text class="mono" x="374" y="436" style="fill:var(--fork)">4 auth-tests ●</text>
          <text class="mono sm" x="490" y="436">│</text>
          <text class="mono" x="502" y="436" style="fill:var(--muted)">5 perf-audit ◌ bg</text>
          <text class="mono sm" x="962" y="436" text-anchor="end">$1.84 · ctrl+\ 1-9 jump · z zoom</text>
        
</svg>
