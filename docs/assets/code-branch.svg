<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1024 286" width="1024" height="286" role="img" aria-label="Git graph: main has commits A and B plus live uncommitted work. Snapshot commit S freezes B plus that work. The fork commits c1 and c2 on pit/fix-login. pit merge brings back only S to c2, choosing merge, apply, or defer depending on the main working tree.">
<title>Git graph: main has commits A and B plus live uncommitted work. Snapshot commit S freezes B plus that work. The fork commits c1 and c2 on pit/fix-login. pit merge brings back only S to c2, choosing merge, apply, or defer depending on the main working tree.</title>
<style>
:root{--bg:#F2F4F3;--surface:#FFFFFF;--fg:#1B1F22;--muted:#5A6369;--line:#C4CACD;--lane:#E7EBEA;--main:#2C6A9E;--main-soft:#D4E3EF;--fork:#B8730A;--fork-soft:#F5E2C2;--ok:#2E7D4F;
--display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#0D1117;--surface:#161B22;--fg:#E6EDF3;--muted:#9AA4AD;--line:#3A4247;--lane:#1B2127;--main:#6FA8D8;--main-soft:#1D3245;--fork:#E3A33B;--fork-soft:#3B2C12;--ok:#5DBB85}}
text{font-family:var(--body);fill:var(--fg);font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.sm{font-size:11px;fill:var(--muted)}
.lane-label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;fill:var(--muted)}
.lane{fill:var(--lane)}
.stroke{stroke:var(--muted);fill:none;stroke-width:1.5}
.stroke-m{stroke:var(--main);fill:none;stroke-width:2}
.stroke-f{stroke:var(--fork);fill:none;stroke-width:2}
.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 4}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box-m{fill:var(--main-soft);stroke:var(--main);stroke-width:1.4}
.box-f{fill:var(--fork-soft);stroke:var(--fork);stroke-width:1.4}
.box-cli{fill:var(--surface);stroke:var(--fg);stroke-width:1.4}
.fill-m{fill:var(--main)}.fill-f{fill:var(--fork)}.fill-n{fill:var(--muted)}.fill-bg{fill:var(--surface)}
.t-m{fill:var(--main)}.t-f{fill:var(--fork)}.t-ok{fill:var(--ok)}
.on-dark{fill:var(--surface);font-family:var(--mono);font-size:11px}
.b{font-weight:600}
.mk-n{fill:var(--muted)}.mk-m{fill:var(--main)}.mk-f{fill:var(--fork)}
.backdrop{fill:var(--bg)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-n" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-f" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="backdrop" x="-12" y="-12" width="1024" height="286" rx="14"/>

          <text class="mono" x="20" y="64" style="fill:var(--main)">main</text>
          <text class="mono" x="20" y="164" style="fill:var(--fork)">pit/fix-login</text>

          <line class="stroke-m" x1="174" y1="60" x2="256" y2="60"/>
          <circle class="fill-m" cx="160" cy="60" r="14"/><text class="on-dark" x="160" y="64" text-anchor="middle">A</text>
          <circle class="fill-m" cx="270" cy="60" r="14"/><text class="on-dark" x="270" y="64" text-anchor="middle">B</text>
          <text class="sm b" x="270" y="34" text-anchor="middle" style="fill:var(--main)">HEAD</text>
          <line class="stroke-m dash" x1="284" y1="60" x2="310" y2="60"/>
          <rect class="box-m" x="310" y="44" width="200" height="32" rx="4" style="stroke-dasharray:5 4"/>
          <text x="410" y="64" text-anchor="middle" style="font-size:12px">uncommitted work (live)</text>

          <!-- snapshot -->
          <path class="stroke" d="M270 74 C 270 140, 300 160, 344 160" marker-end="url(#ah)"/>
          <line class="stroke dot" x1="410" y1="78" x2="368" y2="146" marker-end="url(#ah)"/>
          <text class="sm" x="398" y="120">frozen copy</text>
          <rect class="fill-bg" x="348" y="148" width="24" height="24" rx="3" style="stroke:var(--fg);stroke-width:1.6"/>
          <text class="mono b" x="360" y="164" text-anchor="middle" style="font-size:11px">S</text>
          <text class="sm" x="360" y="196" text-anchor="middle">snapshot</text>

          <line class="stroke-f" x1="372" y1="160" x2="466" y2="160"/>
          <line class="stroke-f" x1="494" y1="160" x2="576" y2="160"/>
          <circle class="fill-f" cx="480" cy="160" r="14"/><text class="on-dark" x="480" y="164" text-anchor="middle">c1</text>
          <circle class="fill-f" cx="590" cy="160" r="14"/><text class="on-dark" x="590" y="164" text-anchor="middle">c2</text>
          <line class="stroke" x1="466" y1="186" x2="604" y2="186"/>
          <text class="sm" x="535" y="204" text-anchor="middle">only S..c2 goes back</text>

          <!-- merge decision -->
          <text class="b" x="700" y="36" style="font-family:var(--display);font-size:16px;letter-spacing:.04em">PIT MERGE PICKS ONE</text>
          <path class="stroke-f" d="M604 160 C 650 160, 650 70, 696 70" marker-end="url(#ahf)"/>
          <path class="stroke-f" d="M604 160 C 650 160, 650 140, 696 140" marker-end="url(#ahf)"/>
          <path class="stroke-f" d="M604 160 C 650 160, 650 210, 696 210" marker-end="url(#ahf)"/>
          <rect class="box" x="700" y="50" width="285" height="40" rx="5"/>
          <text x="714" y="75"><tspan class="b">main tree clean</tspan> → git merge --no-ff</text>
          <rect class="box" x="700" y="120" width="285" height="40" rx="5"/>
          <text x="714" y="145"><tspan class="b">no shared files</tspan> → apply as unstaged</text>
          <rect class="box" x="700" y="190" width="285" height="40" rx="5"/>
          <text x="714" y="215"><tspan class="b">otherwise</tspan> → keep branch, tell main</text>
          <text class="sm" x="700" y="252">every path also writes the inbox note</text>
        
</svg>
