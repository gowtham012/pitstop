<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1024 444" width="1024" height="444" role="img" aria-label="Swimlane timeline: the main session keeps running tests while pit fork copies its context into a fork session, the fork fixes the bug, pit merge writes an inbox message, and a PostToolUse hook delivers it to the main session.">
<title>Swimlane timeline: the main session keeps running tests while pit fork copies its context into a fork session, the fork fixes the bug, pit merge writes an inbox message, and a PostToolUse hook delivers it to the main session.</title>
<style>
:root{--bg:#F2F4F3;--surface:#FFFFFF;--fg:#1B1F22;--muted:#5A6369;--line:#C4CACD;--lane:#E7EBEA;--main:#2C6A9E;--main-soft:#D4E3EF;--fork:#B8730A;--fork-soft:#F5E2C2;--ok:#2E7D4F;
--display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#0D1117;--surface:#161B22;--fg:#E6EDF3;--muted:#9AA4AD;--line:#3A4247;--lane:#1B2127;--main:#6FA8D8;--main-soft:#1D3245;--fork:#E3A33B;--fork-soft:#3B2C12;--ok:#5DBB85}}
text{font-family:var(--body);fill:var(--fg);font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.sm{font-size:11px;fill:var(--muted)}
.lane-label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;fill:var(--muted)}
.lane{fill:var(--lane)}
.stroke{stroke:var(--muted);fill:none;stroke-width:1.5}
.stroke-m{stroke:var(--main);fill:none;stroke-width:2}
.stroke-f{stroke:var(--fork);fill:none;stroke-width:2}
.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 4}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box-m{fill:var(--main-soft);stroke:var(--main);stroke-width:1.4}
.box-f{fill:var(--fork-soft);stroke:var(--fork);stroke-width:1.4}
.box-cli{fill:var(--surface);stroke:var(--fg);stroke-width:1.4}
.fill-m{fill:var(--main)}.fill-f{fill:var(--fork)}.fill-n{fill:var(--muted)}.fill-bg{fill:var(--surface)}
.t-m{fill:var(--main)}.t-f{fill:var(--fork)}.t-ok{fill:var(--ok)}
.on-dark{fill:var(--surface);font-family:var(--mono);font-size:11px}
.b{font-weight:600}
.mk-n{fill:var(--muted)}.mk-m{fill:var(--main)}.mk-f{fill:var(--fork)}
.backdrop{fill:var(--bg)}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-n" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-f" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="backdrop" x="-12" y="-12" width="1024" height="444" rx="14"/>

          <!-- lanes -->
          <rect class="lane" x="0" y="20" width="1000" height="80" rx="6"/>
          <rect class="lane" x="0" y="110" width="1000" height="80" rx="6" opacity=".55"/>
          <rect class="lane" x="0" y="200" width="1000" height="80" rx="6"/>
          <rect class="lane" x="0" y="290" width="1000" height="80" rx="6" opacity=".55"/>
          <text class="lane-label" x="20" y="65">LEFT PANE · MAIN</text>
          <text class="lane-label" x="20" y="155">YOU · HOTKEYS</text>
          <text class="lane-label" x="20" y="245">RIGHT PANE · FORK</text>
          <text class="lane-label" x="20" y="335">INBOX + HOOK</text>

          <!-- main session bar -->
          <rect class="box-m" x="180" y="45" width="650" height="30" rx="4"/>
          <text x="194" y="65"><tspan class="t-m b">Main session</tspan> keeps running the full test suite (never paused)</text>
          <circle class="fill-f" cx="850" cy="60" r="7"/>
          <rect class="box-m" x="870" y="45" width="115" height="30" rx="4"/>
          <text x="927" y="65" text-anchor="middle" class="t-m b">aware of fix</text>

          <!-- pit fork -->
          <rect class="box-cli" x="185" y="135" width="205" height="30" rx="4"/>
          <text class="mono" x="197" y="155">F2 "fix login 500"</text>
          <text class="sm" x="187" y="182">snapshot · worktree · trim · split</text>
          <line class="stroke dash" x1="230" y1="135" x2="230" y2="79" marker-end="url(#ah)"/>
          <text class="sm" x="238" y="106">copies context (read only)</text>

          <!-- fork bar -->
          <path class="stroke-f" d="M390 150 C 410 150, 405 240, 421 240" marker-end="url(#ahf)"/>
          <rect class="box-f" x="425" y="225" width="215" height="30" rx="4"/>
          <text x="437" y="245"><tspan class="t-f b">Fork:</tspan> fix auth.py · test · commit</text>
          <text class="sm" x="425" y="272">own worktree + trimmed context</text>

          <!-- pit merge -->
          <path class="stroke-f" d="M640 240 C 655 240, 650 150, 661 150" marker-end="url(#ahf)"/>
          <text class="sm" x="653" y="205">done</text>
          <rect class="box-cli" x="665" y="135" width="165" height="30" rx="4"/>
          <text class="mono" x="677" y="155">F3  (merge)</text>

          <!-- inbox -->
          <line class="stroke" x1="735" y1="165" x2="735" y2="311" marker-end="url(#ah)"/>
          <text class="sm" x="728" y="300" text-anchor="end">writes update</text>
          <rect class="box" x="700" y="315" width="170" height="30" rx="4"/>
          <text class="mono" x="712" y="335">inbox/&#60;P&#62;/msg.json</text>

          <!-- hook delivers -->
          <line class="stroke-f" x1="850" y1="315" x2="850" y2="71" marker-end="url(#ahf)"/>
          <text class="sm" x="858" y="196">PostToolUse hook</text>
          <text class="sm" x="858" y="210">injects update</text>

          <!-- time axis -->
          <line class="stroke" x1="180" y1="395" x2="985" y2="395" marker-end="url(#ah)"/>
          <text class="sm" x="985" y="414" text-anchor="end">time</text>
        
</svg>
