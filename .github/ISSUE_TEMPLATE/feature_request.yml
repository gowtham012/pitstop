name: Feature request
description: Suggest something pitstop should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do when pitstop got in the way, or didn't help?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
